[package]
name = "zeroui-rs"
version = "0.1.0"
edition = "2024"
description = "build desktop apps with zeroui-rs wrapped around gpui.rs"
license = "MIT OR Apache-2.0"
repository = "https://github.com/blockz-code/zeroui-rs"
readme = "README.md"
keywords = ["desktop", "native"]
categories = ["development-tools"]
authors = ["p1mo <101986259+p1mo@users.noreply.github.com>"]

[features]
all = []
default = []

gpui-component = [ "dep:gpui-component" ]

[build-dependencies]
include_dir = "0.7.4"

[dependencies]
tokio = { version = "1", features = ["rt"] }

serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

log = "0.4.29"
env_logger = "0.11.8"
anyhow = "1.0.100"
thiserror = "2.0.17"
reqwest = { version = "0.13.4", features = ["blocking", "json"] }


gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component", optional = true }
cargo-packager-updater = "0.2.3"

which = "8.0.0"
rand = "0.10.1"
dirs = "6.0.0"
nanoid = "0.5.0"
schemars = "1.1.0"
fs-walk = "0.2.2"


include_dir = "0.7.4"
rust-embed  = { version = "8.12.0", features = ["compression", "interpolate-folder-path", "deterministic-timestamps", "debug-embed", "include-exclude"] }


rusqlite = { version = "0.40.1", features = ["bundled"] }


[[example]]
name = "main"
path = "examples/main.rs"