[package]
name = "zeroui-rs"
version = "0.1.0"
edition = "2024"
description = "build desktop apps with zeroui-rs wrapped around gpui.rs"
license = "MIT OR Apache-2.0"
repository = "https://github.com/blockz-code/zeroui-rs"
readme = "README.md"
keywords = ["desktop", "native"]
categories = ["development-tools"]
authors = ["p1mo <101986259+p1mo@users.noreply.github.com>"]


[features]
all = []
default = []
gpui-component = [ "dep:gpui-component" ]


[build-dependencies]
include_dir = "0.7.4"


[dependencies]
tokio = { version = "1", features = ["rt"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

log = "0.4"
env_logger = "0.11"
anyhow = "1"
thiserror = "2"
reqwest = { version = "0.13", features = ["blocking", "json"] }

gpui = { git = "https://github.com/zed-industries/zed", tag = "v1.10.2" }
gpui-component = { git = "https://github.com/longbridge/gpui-component", optional = true }

cargo-packager-updater = "0.2.3"

which = "8"
rand = "0.10"
dirs = "6"
nanoid = "0.5"
schemars = "1.2"
fs-walk = "0.2"
include_dir = "0.7"
rusqlite = { version = "0.40", features = ["bundled"] }
rust-embed  = { version = "8", features = ["compression", "interpolate-folder-path", "deterministic-timestamps", "debug-embed", "include-exclude"] }


[target.'cfg(target_os = "windows")'.dependencies]
gpui_platform = { git = "https://github.com/zed-industries/zed", tag = "v1.10.2", features = [] }

[target.'cfg(target_os = "linux")'.dependencies]
gpui_platform = { git = "https://github.com/zed-industries/zed", tag = "v1.10.2", features = ["x11", "wayland"] }

[target.'cfg(target_os = "macos")'.dependencies]
gpui_platform = { git = "https://github.com/zed-industries/zed", tag = "v1.10.2", features = ["font-kit"] }


[[example]]
name = "main"
path = "examples/main.rs"